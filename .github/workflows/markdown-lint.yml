name: Markdown

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", "scripts/lib/check-links.mjs"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", "scripts/lib/check-links.mjs"]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint Markdown
        run: npm run lint:md
      - name: Check relative links
        run: npm run check:links
