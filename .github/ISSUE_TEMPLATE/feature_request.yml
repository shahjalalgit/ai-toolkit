name: Feature request
description: Suggest an improvement to an existing module or the toolkit.
labels: [enhancement]
body:
  - type: input
    id: module
    attributes:
      label: Module
      description: Module id, or "toolkit" for repository-wide changes.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
